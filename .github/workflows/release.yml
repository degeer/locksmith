name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          GOARCH=arm64 go build -ldflags="-s -w" -o locksmith-darwin-arm64 .
          GOARCH=amd64 go build -ldflags="-s -w" -o locksmith-darwin-amd64 .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            locksmith-darwin-arm64
            locksmith-darwin-amd64
